[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rec-feature-search"
version = "0.1.0"
description = "Temporal feature search for implicit movie recommendation"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.3", "scipy==1.16.3",
  "scikit-learn==1.8.0", "catboost==1.2.10", "pyarrow==21.0.0",
  "matplotlib==3.10.7", "requests==2.32.5", "psutil==7.1.2", "threadpoolctl==3.7.0", "filelock==3.20.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.1"]
neural = ["torch==2.5.1"]

[project.scripts]
rec = "rec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
